# Recommended GitHub labels.
# GitHub does not apply this file automatically; use it as the source of truth
# when creating or synchronizing labels under Settings → Issues → Labels.
labels:
  - name: good first issue
    color: "7057ff"
    description: A scoped task for people who are new to contributing
  - name: help wanted
    color: "008672"
    description: The team is looking for community help
  - name: bug
    color: "d73a4a"
    description: Something is not working as expected
  - name: frontend
    color: "1d76db"
    description: Interface, React, styles, or user experience
  - name: backend
    color: "5319e7"
    description: Supabase, migrations, RLS, or Edge Functions
  - name: documentation
    color: "0075ca"
    description: README, guides, comments, or educational content
  - name: enhancement
    color: "a2eeef"
    description: An improvement or new capability
