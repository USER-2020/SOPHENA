        <h1>SOPHENA — Entiende. Decide. Avanza.</h1>
        <p>SOPHENA es una plataforma privada para entender hábitos, registrar impulsos y recaídas, seguir el progreso y construir cambios sostenibles.</p>
        <h2>Qué puedes hacer</h2>
        <ul>
          <li>Registrar hábitos, check-ins diarios e impulsos.</li>
          <li>Observar patrones, rachas y progreso personal.</li>
          <li>Registrar recaídas sin borrar el historial.</li>
          <li>Seguir ahorros, puntos, logros y recompensas.</li>
        </ul>
        <p>Disponible en español e inglés. El idioma se selecciona automáticamente desde el navegador y puede cambiarse con el selector ES/EN.</p>
