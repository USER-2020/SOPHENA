<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">SOPHENA — Understand. Decide. Move forward.</title>
  <desc id="desc">A private platform for understanding habits and building sustainable change.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D0B12"/>
      <stop offset="1" stop-color="#211C2C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#75D6C4"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#bg)"/>
  <circle cx="990" cy="110" r="180" fill="#A78BFA" opacity=".16" filter="url(#glow)"/>
  <circle cx="1030" cy="505" r="150" fill="#75D6C4" opacity=".13" filter="url(#glow)"/>
  <g transform="translate(92 105)">
