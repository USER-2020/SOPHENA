  <text x="96" y="382" fill="#75D6C4" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700">Move forward.</text>
  <text x="100" y="470" fill="#AAA4B4" font-family="Arial, Helvetica, sans-serif" font-size="24">Understand your habits · track your journey · celebrate every step</text>
